modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0"
issueTrackerURL = "https://github.com/traelmyx/game-menu-remove-gfarb-reborn/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx, MORIMORI0317"
${logo_key} = "assets/gamemenuremovegfarb/icon.png"
displayTest = "IGNORE_ALL_VERSION"
description = '''Removes the "Give Feedback" and "Report Bugs" buttons from the pause menu. Based on Game Menu Remove GFARB by MORIMORI0317.'''

[[mixins]]
config = "gamemenuremovegfarb.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "CLIENT"
